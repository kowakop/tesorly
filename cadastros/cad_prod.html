<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
</head>
<body>

    <p>Equipe Sarolau</p>
    
    <button><a href="index.html">◀️</a></button>

    <img src="logo_tesorly.png" alt="Logo Tesorly">

    <img src="foto.png" alt="foto produtos">

    <form action="" method="post">

        <div class="form-content">
            <label for="name">Nome do Produto:</label>
            <input type="text" id="name" name="name">
        </div>

        <div class="form-content">
            <label for="name">Marca do Produto:</label>
            <input type="text" id="marca" name="marca">
        </div>

        <div class="form-content">
            <label for="name">Fotos</label>
            <input type="file" id="fotos" name="fotos">
        </div>

        <input type="submit" value="Finalizar Cadastro" id="cadastro">
    </form>
</body>
</html>
