<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <title>Login - Tesorly</title>
</head>
<body>

    <h1>Login</h1>

    <form action="" method="post" id="form">

        <div class="form-content">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <a>Mensagem de erro</a>
        </div>

        <div class="form-content">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha">
            <a>Mensagem de erro</a>
        </div>
        
        <div class="form-content">
            <div class="mostrarSenha">
                <input type="checkbox" id="mostrar-senha" name="mostrar-senha">
                <label for="mostrar-senha">Mostrar Senha</label>
            </div> 
        </div>
        
        <!--dps transformar em um olhinho, vcs que sabem | acho q dá pra importar-->

        <div class="registro">
            <p>Não tem uma conta? <a href="cadastro.html">Registre-se</a></p>
        </div>

        <button type="submit">Entrar</button>
    </form>

</body>
</html>
