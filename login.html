<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <title>Login - Tesorly</title>
</head>
<body>

    <header>
        <img src="logo_sarolau.png" alt="Logo Sarolau">
        <h1>Equipe Sarolau</h1>
        <button>◀️</button>
    </header>

    <img src="user_logo.png" alt="Logo de Usuário" id="user-logo">
    <h1>Seja bem-vindo(a) de volta!</h1>

    <form action="" method="post" id="form">

        <div class="form-content">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
        </div>

        <div class="form-content">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha">
        </div>
        
        <div class="form-content">
            <div class="mostrarSenha">
                <input type="checkbox" id="mostrar-senha" name="mostrar-senha">
                <label for="mostrar-senha">Mostrar Senha</label>
            </div> 
        </div>

        <div class="registro">
            <p>Não tem uma conta? <a href="cadastro.html">Registre-se</a></p>
        </div>

        <div class="password">
            <p>Esqueci a senha</p>
        </div>

        <button type="submit">Entrar</button>
    </form>
        
        <!--dps transformar em um olhinho, vcs que sabem | acho q dá pra importar-->

</body>
</html>
